name: workflow_app
description: "App B2C de Gestión de Trámites BPM — Exclusiva para el Cliente Final."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # ── Estado ──────────────────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1           # Gestor de estado reactivo

  # ── Red / API ────────────────────────────────────────────────────────────────
  dio: ^5.9.2                        # Cliente HTTP con interceptores JWT
  pretty_dio_logger: ^1.4.0          # Logs de requests en consola (dev)

  # ── Almacenamiento Seguro ────────────────────────────────────────────────────
  flutter_secure_storage: ^10.3.1     # Guardar JWT de forma cifrada en el dispositivo

  # ── Navegación ───────────────────────────────────────────────────────────────
  go_router: ^17.2.3                 # Enrutamiento declarativo type-safe

  # ── UI / Tipografía ──────────────────────────────────────────────────────────
  google_fonts: ^8.1.0               # Fuentes premium (Inter, Outfit)
  cupertino_icons: ^1.0.8

  # ── Utilidades ───────────────────────────────────────────────────────────────
  intl: ^0.19.0                      # Formateo de fechas y hora
  json_annotation: ^4.9.0           # Serialización JSON
  file_picker: ^11.0.2
  stomp_dart_client: ^3.0.1          # STOMP sobre WebSocket (tiempo real)
  speech_to_text: ^7.4.0             # Reconocimiento de voz
  audioplayers: ^5.2.1               # Reproducción de audio (ElevenLabs)
  animate_do: ^5.1.0                 # Animaciones tipo pop
  path_provider: ^2.1.5              # Guardar temporales de audio
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^7.1.1
  isar: ^3.1.0+1
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  just_audio: ^0.10.5
  isar_flutter_libs: ^3.1.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true
