spring.application.name=backend

# ============================================================
# SECURIZACIÓN: Variables inyectadas desde entorno (.env)
# NUNCA colocar credenciales en texto plano en este archivo.
# ============================================================

# NB: Las variables de entorno (SPRING_DATA_MONGODB_URI, JWT_SECRET, etc.) 
# son mapeadas automáticamente por Spring Boot desde Docker/Entorno.
# No es necesario declararlas explícitamente aquí si se pasan por entorno.
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://mongodb_bpm:27017/bpm_workflow}
spring.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://mongodb_bpm:27017/bpm_workflow}
jwt.secret=${JWT_SECRET:BPM_WORKFLOW_SECRET_KEY_2026_ULTRA_SECURE_256BIT}
jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}

