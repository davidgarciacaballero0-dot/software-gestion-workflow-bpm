spring.application.name=backend

# ============================================================
# SECURIZACIÓN: Variables inyectadas desde entorno (.env)
# NUNCA colocar credenciales en texto plano en este archivo.
# ============================================================

# --- Base de Datos (MongoDB) ---
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/bpm_workflow}

# --- JSON Web Token (JWT) ---
jwt.secret=${JWT_SECRET:CHANGE_ME_DEFAULT_DEV_KEY_MIN_32_CHARS!!}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
