spring.application.name=backend

# ============================================================
# SECURIZACIÓN: Variables inyectadas desde entorno (.env)
# NUNCA colocar credenciales en texto plano en este archivo.
# ============================================================

# NB: Las variables de entorno (SPRING_DATA_MONGODB_URI, JWT_SECRET, etc.) 
# son mapeadas automáticamente por Spring Boot desde Docker/Entorno.
# No es necesario declararlas explícitamente aquí si se pasan por entorno.
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/bpm_workflow}
spring.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/bpm_workflow}
jwt.secret=${JWT_SECRET:BPM_WORKFLOW_SECRET_KEY_2026_ULTRA_SECURE_256BIT}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# URL del Microservicio IA (por defecto apunta a Cloud Run)
ia.service.url=${IA_SERVICE_URL:https://ia-service-241130514391.us-central1.run.app/ia}

# Límite de subida de archivos (500MB)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# ============================================================
# Google Cloud Storage (GCS) Configuration
# ============================================================
gcp.storage.bucket-name=${GCP_STORAGE_BUCKET:bpm-documentos-adjuntos-798ae}

