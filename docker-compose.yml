services:
  # ============================================================
  # MongoDB - Base de Datos Documental
  # ============================================================
  mongodb_bpm:
    image: mongo:latest
    container_name: mongodb_bpm
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGO_INITDB_DATABASE=bpm_workflow

  # ============================================================
  # Backend Spring Boot - API REST BPM
  # ============================================================
  backend-spring:
    build:
      context: ./backend_bpm
      dockerfile: Dockerfile
    container_name: backend_bpm_api
    ports:
      - "8080:8080"
    depends_on:
      - mongodb_bpm
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb_bpm:27017/bpm_workflow
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-86400000}
      - IA_SERVICE_URL=http://ia-service:8000/ia
      - GCP_STORAGE_BUCKET=${GCP_STORAGE_BUCKET:-bpm-documentos-adjuntos-798ae}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-creds.json
    volumes:
      - ${APPDATA}/gcloud/application_default_credentials.json:/app/gcp-creds.json:ro


  # ============================================================
  # IA Microservice - FastAPI
  # ============================================================
  ia-service:
    build:
      context: ./ia_microservice
      dockerfile: Dockerfile
    container_name: ia_microservice_api
    ports:
      - "8000:8000"
    depends_on:
      - mongodb_bpm
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://mongodb_bpm:27017/bpm_workflow
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-creds.json
    volumes:
      - ${APPDATA}/gcloud/application_default_credentials.json:/app/gcp-creds.json:ro
      - ./ia_microservice:/app

  # ============================================================
  # Frontend Angular - SPA
  # ============================================================
  frontend-angular:
    build:
      context: ./frontend-bpm
      dockerfile: Dockerfile
    container_name: frontend_bpm_app
    ports:
      - "4200:80"
    depends_on:
      - backend-spring
    restart: unless-stopped

  # ============================================================
  # OnlyOffice Document Server
  # ============================================================
  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: onlyoffice_server
    ports:
      - "8081:80"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-secret-jwt-onlyoffice}
      - JWT_HEADER=Authorization

volumes:
  mongodb_data:
