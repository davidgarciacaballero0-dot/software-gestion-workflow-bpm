<div class="collab-container bg-[#0b0f19] text-[#e2e8f0] h-full flex flex-col">
  <div class="header bg-[#151f32] p-4 flex justify-between items-center border-b border-slate-700/50">
    <div class="flex items-center gap-4">
      <h2 class="text-xl font-bold text-white">Edición Colaborativa</h2>
      <div class="status-badge px-3 py-1 rounded-full text-xs font-semibold"
           [ngClass]="{
             'bg-green-500/20 text-green-400': status === 'connected',
             'bg-yellow-500/20 text-yellow-400': status === 'connecting',
             'bg-red-500/20 text-red-400': status === 'disconnected'
           }">
        {{ status === 'connected' ? 'En línea' : status === 'connecting' ? 'Conectando...' : 'Desconectado' }}
      </div>
    </div>
    <div class="actions flex items-center gap-4">
      <div class="active-users flex -space-x-2">
        <div *ngFor="let user of activeUsers" 
             class="w-8 h-8 rounded-full border-2 border-[#151f32] flex items-center justify-center text-white font-bold text-sm shadow-sm"
             [style.backgroundColor]="user.color"
             [title]="user.name">
          {{ user.name.charAt(0).toUpperCase() }}
        </div>
      </div>
      <button (click)="guardarDocumento()" class="bg-sky-500 hover:bg-sky-400 text-slate-900 font-semibold px-4 py-2 rounded transition-colors shadow-lg">
        Guardar
      </button>
    </div>
  </div>

  <div class="editor-wrapper flex-1 overflow-y-auto p-8 bg-[#0f172a]">
    <div class="prose-container bg-[#1e293b] max-w-4xl mx-auto rounded-xl shadow-xl min-h-[600px] border border-slate-700/50">
      <div #editorContainer class="p-8"></div>
    </div>
  </div>
</div>
