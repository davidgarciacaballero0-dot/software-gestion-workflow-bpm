<div class="form-card monolith-surface shadow-ambient">
  <div class="form-header">
    <h3>Alta de Nueva Organización (Tenant)</h3>
    <p>Registre los datos fiscales y la parametrización gráfica corporativa.</p>
  </div>

  <div *ngIf="successMessage" class="alert alert-success">
    {{ successMessage }}
  </div>

  <form [formGroup]="orgForm" (ngSubmit)="onSubmit()" class="corporate-form">
    
    <div class="form-group">
      <label for="nombre">Nombre Oficial / Razón Social <span class="required">*</span></label>
      <input type="text" id="nombre" formControlName="nombre" class="form-control" autocomplete="off" placeholder="Ej: Ministerio de Obras">
      <div class="error-msg" *ngIf="orgForm.get('nombre')?.invalid && orgForm.get('nombre')?.touched">
        Debe poseer al menos 3 caracteres corporativos.
      </div>
    </div>

    <div class="row">
      <div class="form-group col-md-6">
        <label for="colorPrimario">Color Institucional (Primario)</label>
        <input type="color" id="colorPrimario" formControlName="colorPrimario" class="form-control color-picker">
      </div>
      <div class="form-group col-md-6">
        <label for="colorSecundario">Color de Fondo (Secundario)</label>
        <input type="color" id="colorSecundario" formControlName="colorSecundario" class="form-control color-picker">
      </div>
    </div>

    <div class="form-actions" style="gap: 1rem; display: flex; justify-content: flex-end;">
      <button type="button" class="btn btn-secondary" (click)="cancelar()">Descartar</button>
      <button type="submit" class="btn-premium btn-premium-primary" [disabled]="orgForm.invalid || isSubmitting">
        <span *ngIf="isSubmitting" class="spinner"></span>
        <span class="material-symbols-outlined" *ngIf="!isSubmitting">domain_add</span>
        {{ isSubmitting ? 'Autorizando...' : 'Registrar Tenant' }}
      </button>
    </div>
  </form>
</div>
