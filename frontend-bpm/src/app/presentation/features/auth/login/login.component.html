<div class="auth-page">
  <div class="auth-box monolith-surface animate-fade-in shadow-ambient">
    <div class="auth-header">
      <div class="auth-logo">BPM</div>
      <h1>Gestión de Procesos</h1>
      <p>Acceso administrativo y operativo institucional</p>
    </div>

    <!-- Feedback Message -->
    <div *ngIf="errorMessage" class="error-toast ghost-border">
      <span class="icon">🚨</span>
      <p>{{ errorMessage }}</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="input-field">
        <label>Correo Electrónico Corporativo</label>
        <div class="input-wrapper">
          <span class="icon">📧</span>
          <input type="email" formControlName="email" placeholder="nombre@institucion.gob" autocomplete="email">
        </div>
      </div>

      <div class="input-field">
        <label>Contraseña Maestro</label>
        <div class="input-wrapper">
          <span class="icon">🔑</span>
          <input type="password" formControlName="password" placeholder="••••••••" autocomplete="current-password">
        </div>
      </div>

      <button type="submit" class="btn-premium btn-premium-primary w-full" [disabled]="loginForm.invalid || isSubmitting">
        <span *ngIf="isSubmitting" class="spinner"></span>
        {{ isSubmitting ? 'Validando Credenciales...' : 'Iniciar Sesión Segura' }}
      </button>
    </form>

    <footer class="auth-footer">
      <p>Entorno Protegido &bull; © 2026 Sistema BPM</p>
    </footer>
  </div>
</div>
