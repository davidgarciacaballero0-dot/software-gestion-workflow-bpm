<div class="designer-container">
  <!-- Sidebar: Caja de Herramientas -->
  <aside class="sidebar">
    <div class="tool-section">
      <h4>Nodos de Control</h4>
      <div class="node-tool" (click)="addNode('START')">
        <div class="icon-box" style="background: #10b981;">▶</div>
        <span>Inicio</span>
      </div>
      <div class="node-tool" (click)="addNode('USER_TASK')">
        <div class="icon-box" style="background: #3b82f6;">👤</div>
        <span>Tarea Usuario</span>
      </div>
      <div class="node-tool" (click)="addNode('EXCLUSIVE_GATEWAY')">
        <div class="icon-box" style="background: #f59e0b;">◆</div>
        <span>Decisión</span>
      </div>
      <div class="node-tool" (click)="addNode('END')">
        <div class="icon-box" style="background: #ef4444;">■</div>
        <span>Fin</span>
      </div>
    </div>

    <div class="tool-info mt-auto">
      <p class="text-muted small">Arrastra o haz clic para añadir elementos al lienzo.</p>
      <button class="btn btn-primary w-100" (click)="saveWorkflow()">Guardar Política</button>
    </div>
  </aside>

  <!-- Lienzo Central -->
  <main class="canvas-area" id="canvas">
    <!-- Capa SVG para Aristas -->
    <svg class="connections-svg">
      <path *ngFor="let edge of edges" 
            [attr.d]="calculatePath(edge)" 
            class="connector-line"
            [class.active]="selectedEdge === edge.id" />
    </svg>

    <!-- Capa de Nodos Con Arrastre del CDK -->
    <div *ngFor="let node of nodes" 
         class="node-item"
         [class.selected]="selectedNode?.id === node.id"
         [class]="node.type"
         [style.left.px]="node.uiPosition.x"
         [style.top.px]="node.uiPosition.y"
         cdkDrag
         (cdkDragEnded)="onNodeMoved($event, node)"
         (click)="selectNode(node)">
      
      <div class="node-header">
        <div class="icon-box">{{ getNodeIcon(node.type) }}</div>
        {{ node.name }}
      </div>
      <div class="node-sub">
        {{ node.departmentId ? 'Asignado a Dept.' : 'Sin configurar' }}
      </div>

      <!-- Puntos de Conexión (Visuales) -->
      <div class="anchor-point left"></div>
      <div class="anchor-point right" (mousedown)="startConnecting(node, $event)"></div>
    </div>
  </main>

  <!-- Panel de Propiedades Glass -->
  <aside class="properties-panel" [class.open]="selectedNode">
    <div *ngIf="selectedNode">
      <h3>Configurar Nodo</h3>
      <div class="form-group">
        <label>Nombre del Paso</label>
        <input type="text" [(ngModel)]="selectedNode.name" class="form-control-dark">
      </div>
      
      <div *ngIf="selectedNode.type === 'USER_TASK'">
        <div class="form-group">
          <label>Departamento Responsable</label>
          <select [(ngModel)]="selectedNode.departmentId" class="form-control-dark">
            <option *ngFor="let d of departamentos" [value]="d.id">{{ d.nombre }}</option>
          </select>
        </div>
        <div class="form-group">
          <label>Tiempo Límite (SLA Horas)</label>
          <input type="number" [(ngModel)]="selectedNode.slaHours" class="form-control-dark">
        </div>

        <!-- Constructor de Formularios CU-06 -->
        <div class="form-builder-section mt-4">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h4 class="m-0 text-sm uppercase">Formulario Dinámico</h4>
            <button class="btn-icon-add" (click)="addField()">+</button>
          </div>

          <div class="field-list">
            <div *ngFor="let field of selectedNode.formDefinition; let i = index" class="field-card">
              <div class="field-row">
                <input type="text" [(ngModel)]="field.label" class="field-input" placeholder="Etiqueta">
                <button class="btn-remove-tiny" (click)="removeField(i)">×</button>
              </div>
              <div class="field-row mt-1">
                <select [(ngModel)]="field.type" class="field-select">
                  <option value="TEXT">Texto</option>
                  <option value="NUMBER">Número</option>
                  <option value="DATE">Fecha</option>
                  <option value="FILE">Documento</option>
                  <option value="DROPDOWN">Selección</option>
                </select>
                <label class="check-label">
                  <input type="checkbox" [(ngModel)]="field.required"> Req.
                </label>
              </div>
            </div>
          </div>
        </div>
      </div>

      <button class="btn btn-outline-danger mt-4" (click)="removeNode(selectedNode)">Eliminar Nodo</button>
    </div>
  </aside>
</div>
