<div class="form-card">
  <div class="form-header">
    <h3>Incorporación de Personal Corporativo</h3>
    <p>Alta de funcionario y asignación segura de credenciales de sistema.</p>
  </div>

  <div *ngIf="successMessage" class="alert alert-success">
    {{ successMessage }}
  </div>

  <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="corporate-form">

    <div class="row">
      <!-- SELECTORES JERARQUICOS VINCULADOS -->
      <div class="form-group col-md-4">
        <label>Tenant Afiliado <span class="required">*</span></label>
        <select formControlName="idOrganizacion" class="form-control">
          <option value="" disabled>-- Selección Primaria --</option>
          <option *ngFor="let o of organizaciones" [value]="o.id">{{ o.nombre }}</option>
        </select>
      </div>

      <div class="form-group col-md-4">
        <label>Sector / Área <span class="required">*</span></label>
        <select formControlName="idDepartamento" class="form-control">
          <option value="" disabled>-- Dependiente Org --</option>
          <option *ngFor="let d of departamentos" [value]="d.id">{{ d.nombre }}</option>
        </select>
      </div>

      <div class="form-group col-md-4">
        <label>Escala de Acceso <span class="required">*</span></label>
        <select formControlName="idRol" class="form-control">
          <option value="" disabled>-- Asignar ROL --</option>
          <option *ngFor="let r of roles" [value]="r.id">{{ r.nombre }}</option>
        </select>
      </div>
    </div>

    <!-- DATOS PERSONALES Y SEGURIDAD -->
    <div class="row mt-3">
      <div class="form-group col-md-6">
        <label>Designación o Nombre Oficial <span class="required">*</span></label>
        <input type="text" formControlName="nombre" class="form-control" placeholder="Ej. Ana Belén">
      </div>

      <div class="form-group col-md-6">
        <label>Correo Electrónico Laboral <span class="required">*</span></label>
        <input type="email" formControlName="email" class="form-control" autocomplete="new-password" placeholder="nomina@empresa.com">
      </div>
    </div>

    <div class="form-group mt-3">
      <label>Llave Criptográfica Base (Contraseña) <span class="required">*</span></label>
      <input type="password" formControlName="password" class="form-control font-mono" autocomplete="new-password">
      <div class="help-text">Dato volátil: Será protegido irreversiblemente (Bcrypt) durante el tránsito al servidor.</div>
    </div>

    <div class="form-actions mt-4">
      <button type="submit" class="btn btn-primary" [disabled]="userForm.invalid || isSubmitting">
        <span *ngIf="isSubmitting" class="spinner"></span>
        {{ isSubmitting ? 'Inyectando Políticas...' : 'Emitir Credenciales' }}
      </button>
    </div>

  </form>
</div>
